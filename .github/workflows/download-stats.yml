name: download-stats
on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Append a dated row per asset
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          gh api "repos/${REPO}/releases" --paginate \
            --jq ".[] | .tag_name as \$t | .assets[] | [\"${today}\", \$t, .name, .download_count] | @csv" \
            | tr -d '"' >> stats/downloads.csv
      - name: Commit
        run: |
          set -euo pipefail
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/downloads.csv
          git commit -m "stats: download counts $(date -u +%F)"
          git push
